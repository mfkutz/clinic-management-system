services:
  db:
    image: postgres:16-alpine
    container_name: sistema-turnos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema_turnos_dev
    ports:
      - "5432:5432"
    volumes:
      - sistema_turnos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sistema_turnos_db_data:
